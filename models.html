<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Models | HOWAYDA</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Models Page Specific Styles */
        .page-header { background-color: var(--bg-secondary); padding: 8rem 0 4rem; text-align: center; }
        .filters-section { padding: 2rem 0; border-bottom: 1px solid rgba(166, 162, 159, 0.2); margin-bottom: 3rem; }
        .filters-container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .category-filters { display: flex; gap: 1rem; flex-wrap: wrap; }
        .filter-btn { background: transparent; border: 1px solid var(--text-secondary); padding: 0.5rem 1.5rem; border-radius: 30px; color: var(--text-primary); cursor: pointer; transition: var(--transition); font-family: var(--font-body); }
        .filter-btn.active, .filter-btn:hover { background: var(--brand-color); color: var(--white); border-color: var(--brand-color); }
        [data-theme="dark"] .filter-btn.active, [data-theme="dark"] .filter-btn:hover { background: var(--accent-gold); color: var(--bg-primary); border-color: var(--accent-gold); }
        
        .search-box { position: relative; width: 100%; max-width: 300px; }
        .search-box input { width: 100%; padding: 0.8rem 1rem 0.8rem 2.5rem; border-radius: 30px; border: 1px solid var(--text-secondary); background: transparent; color: var(--text-primary); font-family: var(--font-body); }
        [dir="rtl"] .search-box input { padding: 0.8rem 2.5rem 0.8rem 1rem; }
        .search-box i { position: absolute; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }
        [dir="ltr"] .search-box i { left: 1rem; }
        [dir="rtl"] .search-box i { right: 1rem; }

        .models-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 3rem 2rem; margin-bottom: 5rem; }
        .model-card { background: var(--white); border-radius: var(--border-radius); overflow: hidden; box-shadow: var(--shadow-sm); transition: var(--transition); display: flex; flex-direction: column; }
        [data-theme="dark"] .model-card { background: #25201C; }
        .model-card:hover { transform: translateY(-10px); box-shadow: var(--shadow-lg); }
        .model-image { height: 400px; width: 100%; overflow: hidden; position: relative; }
        .model-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s ease; }
        .model-card:hover .model-image img { transform: scale(1.05); }
        .category-tag { position: absolute; top: 1rem; left: 1rem; background: rgba(255,255,255,0.9); color: var(--text-primary); padding: 0.3rem 0.8rem; font-size: 0.8rem; border-radius: 20px; font-weight: 500; }
        [dir="rtl"] .category-tag { left: auto; right: 1rem; }
        [data-theme="dark"] .category-tag { background: rgba(0,0,0,0.7); color: var(--white); }
        .model-info { padding: 1.5rem; display: flex; flex-direction: column; flex-grow: 1; }
        .model-name { font-family: var(--font-heading); font-size: 1.3rem; margin-bottom: 0.5rem; color: var(--brand-color); }
        [data-theme="dark"] .model-name { color: var(--accent-gold); }
        .model-desc { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 1rem; flex-grow: 1; }
        .model-price { font-weight: 600; font-size: 1.1rem; margin-bottom: 1rem; }
        .empty-state { text-align: center; padding: 4rem 0; width: 100%; color: var(--text-secondary); grid-column: 1 / -1; }
    </style>
</head>
<body>

    <!-- Navbar (Simplified) -->
    <nav class="navbar scrolled">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <h1>HOWAYDA</h1>
                <span data-key="logoSubtitle">قمة الأناقة</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html" data-key="navHome">الرئيسية</a></li>
                <li><a href="abaya-size-calculator.html" data-key="navCalculator">حاسبة المقاسات</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>
            <div class="nav-actions">
                <div class="lang-switcher">
                    <button id="lang-ar" class="lang-btn active">AR</button>
                    <span class="lang-sep">|</span>
                    <button id="lang-tr" class="lang-btn">TR</button>
                    <span class="lang-sep">|</span>
                    <button id="lang-en" class="lang-btn">EN</button>
                </div>
                <button id="theme-toggle" aria-label="Toggle Dark Mode">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <header class="page-header">
        <div class="container">
            <h1 class="section-title" data-key="modelsPageTitle" style="font-size: 3.5rem;">التصاميم الحصرية</h1>
            <p class="section-subtitle" data-key="modelsPageDesc">اكتشفي أحدث تصاميم العبايات المصنوعة بحرفية عالية</p>
        </div>
    </header>

    <main class="container">
        <!-- Filters -->
        <section class="filters-section">
            <div class="filters-container">
                <div class="category-filters" id="category-filters">
                    <button class="filter-btn active" data-filter="All" data-key="filterAll">الكل</button>
                    <button class="filter-btn" data-filter="Classic" data-key="filterClassic">كلاسيك</button>
                    <button class="filter-btn" data-filter="Modern" data-key="filterModern">مودرن</button>
                    <button class="filter-btn" data-filter="Luxury" data-key="filterLuxury">فاخر</button>
                </div>
                <div class="search-box">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="model-search" placeholder="ابحثي عن تصميم..." data-key="searchPlaceholder">
                </div>
            </div>
        </section>

        <!-- Models Grid -->
        <section class="models-grid" id="products-display-grid">
            <!-- Models injected via JS -->
        </section>
    </main>

    <!-- Product Modal -->
    <div id="product-modal" class="modal hidden">
        <div class="modal-overlay" id="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="modal-close"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-grid">
                <div class="modal-images">
                    <img id="modal-main-img" src="" alt="Product Image">
                    <div class="modal-thumbnails" id="modal-thumbnails"></div>
                </div>
                <div class="modal-info">
                    <span id="modal-availability" class="badge"></span>
                    <h2 id="modal-title" style="font-family: var(--font-heading); color: var(--brand-color); margin-bottom: 0.5rem;"></h2>
                    <p class="modal-price" id="modal-price" style="font-weight: 600; font-size: 1.2rem; margin-bottom: 1.5rem;"></p>
                    <p id="modal-desc" style="color: var(--text-secondary); line-height: 1.8; margin-bottom: 2.5rem;"></p>
                    <a href="#" id="modal-wa-btn" target="_blank" class="btn btn-whatsapp btn-block" style="justify-content: center; padding: 1rem;"></a>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container text-center">
            <p data-key="footerRights">&copy; 2026 هويدا أتيليه. جميع الحقوق محفوظة.</p>
                <p data-key="footerCredit" style="margin-top: 0.35rem; font-size: 0.85rem; opacity: 0.78;">تم التصميم والتطوير بواسطة <a href="https://www.instagram.com/bestemarketingcom/" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: underline; text-underline-offset: 3px;">فريق بست</a></p>
        </div>
    </footer>

    <!-- JS -->
    <script src="js/script.js"></script>
</body>
</html>
