<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنتجات | هويدا أتيليه</title>
    <meta name="description" content="تصفحي مجموعة هويدا الحصرية من العبايات والأزياء المحتشمة.">
    <link href="https://fonts.googleapis.com/css2family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand: #8A2542;
            --brand-light: #f3e0e6;
            --gold: #c9a96e;
            --bg: #faf9f7;
            --bg2: #f2ede8;
            --white: #ffffff;
            --dark: #1a1a1a;
            --muted: #7a7068;
            --border: #e8e0d8;
            --radius: 14px;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
            --shadow-hover: 0 12px 40px rgba(138,37,66,0.15);
            --transition: all 0.28s cubic-bezier(0.4,0,0.2,1);
        }
        [data-theme="dark"] {
            --bg: #111;
            --bg2: #1a1a1a;
            --white: #1e1e1e;
            --dark: #f0ece6;
            --muted: #a09888;
            --border: #2a2a2a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--dark); font-family: 'Tajawal', 'Poppins', sans-serif; }

        /* PAGE HEADER */
        .page-hero {
            background: linear-gradient(135deg, #1a0a10 0%, #2d1020 60%, #8A2542 100%);
            padding: 7rem 0 3.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .page-hero::before {
            content: '';
            position: absolute; inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a96e' fill-opacity='0.06'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        .page-hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: #fff;
            margin-bottom: 0.75rem;
        }
        .page-hero p { color: var(--gold); font-size: 1.05rem; letter-spacing: 1px; }

        /* FILTER BAR */
        .filter-bar {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 0.9rem 0;
            position: sticky;
            top: 0;
            z-index: 90;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .filter-bar .container { display: flex; justify-content: center; gap: 0.6rem; flex-wrap: wrap; }
        .filter-btn {
            padding: 0.45rem 1.4rem;
            border: 1.5px solid var(--border);
            background: transparent;
            color: var(--muted);
            border-radius: 50px;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--brand);
            color: #fff;
            border-color: var(--brand);
        }

        /* PRODUCTS GRID */
        .products-section { padding: 3rem 0 5rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        /* PRODUCT CARD */
        .product-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
        }
        .product-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-hover); }

        .card-img-wrap {
            position: relative;
            aspect-ratio: 3/4;
            overflow: hidden;
            background: var(--bg2);
        }
        .card-img-wrap img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .product-card:hover .card-img-wrap img { transform: scale(1.06); }

        .card-category {
            position: absolute;
            top: 0.9rem; right: 0.9rem;
            background: rgba(138,37,66,0.9);
            color: #fff;
            padding: 0.2rem 0.75rem;
            border-radius: 50px;
            font-size: 0.75rem;
            backdrop-filter: blur(4px);
        }
        .card-img-count {
            position: absolute;
            bottom: 0.75rem; left: 0.75rem;
            background: rgba(0,0,0,0.55);
            color: #fff;
            padding: 0.2rem 0.6rem;
            border-radius: 50px;
            font-size: 0.72rem;
            display: flex; align-items: center; gap: 0.3rem;
        }

        .card-body { padding: 1.1rem 1.2rem 1.3rem; }
        .card-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.05rem;
            color: var(--dark);
            margin-bottom: 0.35rem;
            line-height: 1.35;
        }
        .card-desc {
            color: var(--muted);
            font-size: 0.82rem;
            margin-bottom: 0.9rem;
            line-height: 1.55;
        }
        .card-footer { display: flex; align-items: center; justify-content: space-between; }
        .card-price { font-weight: 700; color: var(--brand); font-size: 1rem; }
        .card-btn {
            background: var(--brand);
            color: #fff;
            border: none;
            padding: 0.45rem 1rem;
            border-radius: 8px;
            font-size: 0.82rem;
            cursor: pointer;
            font-family: inherit;
            transition: var(--transition);
            display: flex; align-items: center; gap: 0.4rem;
        }
        .card-btn:hover { background: #6b1c34; }

        /* SKELETON */
        .skeleton-card { background: var(--white); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
        .skel { background: linear-gradient(90deg, var(--bg2) 25%, var(--border) 50%, var(--bg2) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
        .skel-img { aspect-ratio: 3/4; }
        .skel-line { height: 14px; border-radius: 4px; margin: 1rem 1.2rem 0.5rem; }
        .skel-line.short { width: 60%; margin-bottom: 1.2rem; }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

        /* EMPTY STATE */
        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            padding: 5rem 2rem;
        }
        .empty-state i { font-size: 3.5rem; color: var(--border); margin-bottom: 1.5rem; }
        .empty-state h3 { color: var(--muted); font-size: 1.3rem; margin-bottom: 0.5rem; }

        /* ===== PRODUCT DETAIL PANEL (slide-in) ===== */
        .product-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 1000;
            opacity: 0; visibility: hidden;
            transition: var(--transition);
            backdrop-filter: blur(3px);
        }
        .product-overlay.open { opacity: 1; visibility: visible; }

        .product-panel {
            position: fixed;
            top: 0; bottom: 0;
            right: 0;
            width: min(860px, 100vw);
            background: var(--bg);
            z-index: 1001;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
            overflow-y: auto;
            display: flex; flex-direction: column;
        }
        [dir="ltr"] .product-panel { right: auto; left: 0; transform: translateX(-100%); }
        .product-panel.open { transform: translateX(0); }

        .panel-close {
            position: absolute;
            top: 1rem; left: 1rem;
            width: 40px; height: 40px;
            border-radius: 50%;
            background: var(--white);
            border: none; cursor: pointer;
            font-size: 1.1rem;
            color: var(--dark);
            box-shadow: var(--shadow);
            display: flex; align-items: center; justify-content: center;
            z-index: 10;
            transition: var(--transition);
        }
        [dir="ltr"] .panel-close { left: auto; right: 1rem; }
        .panel-close:hover { background: var(--brand); color: #fff; }

        .panel-inner {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100%;
        }

        /* Left: Gallery */
        .panel-gallery {
            background: var(--bg2);
            position: relative;
            display: flex; flex-direction: column;
        }
        .panel-main-img {
            aspect-ratio: 3/4;
            width: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
        }
        .panel-thumbs {
            display: flex;
            gap: 0.5rem;
            padding: 0.8rem;
            overflow-x: auto;
            background: var(--white);
        }
        .panel-thumbs::-webkit-scrollbar { height: 4px; }
        .panel-thumbs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
        .thumb-img {
            width: 60px; height: 75px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .thumb-img.active { border-color: var(--brand); }
        .thumb-img:hover { border-color: var(--gold); }

        /* Right: Info */
        .panel-info {
            padding: 2.5rem 2rem 2rem;
            display: flex; flex-direction: column;
            gap: 1.2rem;
        }
        .panel-category {
            display: inline-flex; align-items: center; gap: 0.4rem;
            background: var(--brand-light);
            color: var(--brand);
            padding: 0.3rem 0.9rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            width: fit-content;
        }
        .panel-name {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.3rem, 2.5vw, 1.8rem);
            line-height: 1.3;
            color: var(--dark);
        }
        .panel-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--brand);
        }
        .panel-divider { border: none; border-top: 1px solid var(--border); }
        .panel-desc {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.85;
        }
        .panel-avail {
            display: inline-flex; align-items: center; gap: 0.5rem;
            font-size: 0.85rem; font-weight: 600;
        }
        .avail-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #22c55e;
        }
        .avail-dot.limited { background: #f59e0b; }

        .panel-actions { display: flex; flex-direction: column; gap: 0.75rem; margin-top: auto; }
        .btn-wa {
            display: flex; align-items: center; justify-content: center; gap: 0.6rem;
            background: #25D366;
            color: #fff;
            padding: 0.9rem 1.5rem;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
        }
        .btn-wa:hover { background: #1da851; transform: translateY(-2px); }
        .btn-contact {
            display: flex; align-items: center; justify-content: center; gap: 0.6rem;
            background: transparent;
            color: var(--brand);
            padding: 0.85rem 1.5rem;
            border-radius: 10px;
            border: 1.5px solid var(--brand);
            font-size: 0.95rem;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
        }
        .btn-contact:hover { background: var(--brand-light); }

        .size-hint {
            display: flex; align-items: center; gap: 0.5rem;
            color: var(--muted);
            font-size: 0.82rem;
            cursor: pointer;
            border: none; background: none;
            font-family: inherit;
            padding: 0;
            text-decoration: underline;
            text-decoration-style: dotted;
        }
        .size-hint:hover { color: var(--brand); }

        /* ===== MOBILE RESPONSIVE ===== */
        @media (max-width: 720px) {
            .panel-inner { grid-template-columns: 1fr; }
            .panel-gallery { order: 1; }
            .panel-info { order: 2; padding: 1.5rem 1.2rem; }
            .panel-main-img { aspect-ratio: 1/1; }
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 0.9rem; }
        }
        @media (max-width: 420px) {
            .products-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar scrolled">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span style="font-size:2rem;letter-spacing:2px;font-weight:600;font-family:var(--font-heading);display:block;line-height:1;">HOWAYDA</span>
                <span data-key="logoSubtitle">قمة الأناقة</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html" data-key="navHome">الرئيسية</a></li>
                <li><a href="products.html" data-key="navProducts" class="active">المنتجات</a></li>
                <li><a href="abaya-size-calculator.html" data-key="navCalculator">حاسبة المقاسات</a></li>
            </ul>
            <div class="nav-actions">
                <div class="lang-switcher">
                    <button id="lang-ar" class="lang-btn active">AR</button>
                    <span class="lang-sep">|</span>
                    <button id="lang-tr" class="lang-btn">TR</button>
                    <span class="lang-sep">|</span>
                    <button id="lang-en" class="lang-btn">EN</button>
                </div>
                <button id="theme-toggle" aria-label="Toggle Dark Mode"><i class="fa-solid fa-moon"></i></button>
                <div class="hamburger"><i class="fa-solid fa-bars"></i></div>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <header class="page-hero">
        <div class="container">
            <h1 data-key="productsPageTitle">مجموعاتنا المتكاملة</h1>
            <p data-key="productsPageDesc">اكتشفي الأناقة في كل قطعة</p>
        </div>
    </header>

    <!-- Filter Bar -->
    <div class="filter-bar">
        <div class="container">
            <button class="filter-btn active" data-filter="All" data-key="filterAll">الكل</button>
            <button class="filter-btn" data-filter="Abaya" data-key="filterAbaya">عباية</button>
            <button class="filter-btn" data-filter="Hijab" data-key="filterHijab">حجاب</button>
        </div>
    </div>

    <!-- Products Grid -->
    <main class="products-section">
        <div class="container">
            <div class="products-grid" id="products-display-grid">
                <!-- Skeletons -->
                <div class="skeleton-card"><div class="skel skel-img"></div><div class="skel skel-line"></div><div class="skel skel-line short"></div></div>
                <div class="skeleton-card"><div class="skel skel-img"></div><div class="skel skel-line"></div><div class="skel skel-line short"></div></div>
                <div class="skeleton-card"><div class="skel skel-img"></div><div class="skel skel-line"></div><div class="skel skel-line short"></div></div>
            </div>
        </div>
    </main>

    <!-- Product Detail Overlay -->
    <div class="product-overlay" id="product-overlay"></div>

    <!-- Product Detail Panel -->
    <aside class="product-panel" id="product-panel" role="dialog" aria-modal="true">
        <button class="panel-close" id="panel-close-btn" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button>
        <div class="panel-inner">
            <!-- Gallery -->
            <div class="panel-gallery">
                <img id="panel-main-img" class="panel-main-img" src="" alt="Product">
                <div class="panel-thumbs" id="panel-thumbs"></div>
            </div>
            <!-- Info -->
            <div class="panel-info">
                <div id="panel-category" class="panel-category"><i class="fa-solid fa-tag"></i> <span></span></div>
                <h2 id="panel-name" class="panel-name"></h2>
                <p id="panel-price" class="panel-price"></p>
                <hr class="panel-divider">
                <div id="panel-avail" class="panel-avail">
                    <span class="avail-dot" id="avail-dot"></span>
                    <span id="avail-text"></span>
                </div>
                <p id="panel-desc" class="panel-desc"></p>

                <button class="size-hint" onclick="window.location.href='abaya-size-calculator.html'">
                    <i class="fa-regular fa-ruler"></i> <span>حاسبة المقاسات</span>
                </button>

                <div class="panel-actions">
                    <a id="panel-wa-btn" href="#" target="_blank" class="btn-wa">
                        <i class="fa-brands fa-whatsapp"></i>
                        <span data-key="orderModelWhatsapp">الطلب عبر واتساب</span>
                    </a>
                    <a href="index.html#contact" class="btn-contact">
                        <i class="fa-regular fa-envelope"></i>
                        <span>تواصلي معنا</span>
                    </a>
                </div>
            </div>
        </div>
    </aside>

    <!-- Footer -->
    <footer class="footer">
        <div class="container text-center">
            <p data-key="footerRights">&copy; 2026 هويدا أتيليه. جميع الحقوق محفوظة.</p>
                <p data-key="footerCredit" style="margin-top: 0.35rem; font-size: 0.85rem; opacity: 0.78;">تم التصميم والتطوير بواسطة <a href="https://www.instagram.com/bestemarketingcom/" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: underline; text-underline-offset: 3px;">فريق بست</a></p>
        </div>
        <a href="#" class="back-to-top" aria-label="Back to Top"><i class="fa-solid fa-chevron-up"></i></a>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/sync-engine.js"></script>
    <script src="js/script.js"></script>
    <script>
    // ===== PANEL LOGIC =====
    const overlay   = document.getElementById('product-overlay');
    const panel     = document.getElementById('product-panel');
    const closeBtn  = document.getElementById('panel-close-btn');
    const mainImg   = document.getElementById('panel-main-img');
    const thumbsWrap = document.getElementById('panel-thumbs');

    function openPanel(product) {
        const lang = localStorage.getItem('preferredLang') || 'ar';
        const t = (typeof translations !== 'undefined' && translations[lang]) ? translations[lang] : {};

        // Names & desc
        let name = product.name_ar || product.name || '';
        if (lang === 'tr') name = product.name_tr || product.name || name;
        if (lang === 'en') name = product.name_en || product.name || name;

        let desc = product.description_ar || product.description || '';
        if (lang === 'tr') desc = product.description_tr || product.description || desc;
        if (lang === 'en') desc = product.description_en || product.description || desc;

        // Category label
        const catMap = { Abaya: { ar:'عباية', tr:'Abaya', en:'Abaya' }, Hijab: { ar:'حجاب', tr:'Başörtüsü', en:'Hijab' } };
        const catLabel = (catMap[product.category] && catMap[product.category][lang]) || product.category || '';

        document.getElementById('panel-name').textContent = name || '';
        document.getElementById('panel-price').textContent = product.price || '';
        document.getElementById('panel-desc').textContent = desc || '';
        const catEl = document.getElementById('panel-category');
        catEl.querySelector('span').textContent = catLabel;
        catEl.style.display = catLabel ? '' : 'none';

        // Availability
        const isLimited = product.availability === 'Limited';
        document.getElementById('avail-dot').className = 'avail-dot' + (isLimited ? ' limited' : '');
        document.getElementById('avail-text').textContent = isLimited
             ? (t.limitedStock || 'كمية محدودة')
            : (t.inStock || 'متوفر');

        // Images
        let imgs = product.images && product.images.length > 0
             ? product.images
            : (product.image ? [product.image] : ['https://placehold.co/600x800/EBD7C9/8A2542text=No+Image']);

        mainImg.src = imgs[0];
        mainImg.style.opacity = 1;

        thumbsWrap.innerHTML = '';
        if (imgs.length > 1) {
            imgs.forEach((src, i) => {
                const img = document.createElement('img');
                img.src = src;
                img.className = 'thumb-img' + (i === 0 ? ' active' : '');
                img.alt = `صورة ${i+1}`;
                img.onclick = () => {
                    mainImg.style.opacity = 0;
                    setTimeout(() => { mainImg.src = src; mainImg.style.opacity = 1; }, 200);
                    thumbsWrap.querySelectorAll('.thumb-img').forEach(t => t.classList.remove('active'));
                    img.classList.add('active');
                };
                thumbsWrap.appendChild(img);
            });
            thumbsWrap.style.display = 'flex';
        } else {
            thumbsWrap.style.display = 'none';
        }

        // WhatsApp
        const waMsg = lang === 'ar'
             ? `السلام عليكم، أريد طلب: ${name}`
            : `Merhaba, sipariş etmek istiyorum: ${name}`;
        document.getElementById('panel-wa-btn').href = `https://wa.me/905370498740text=${encodeURIComponent(waMsg)}`;

        overlay.classList.add('open');
        panel.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closePanel() {
        overlay.classList.remove('open');
        panel.classList.remove('open');
        document.body.style.overflow = '';
    }

    closeBtn.addEventListener('click', closePanel);
    overlay.addEventListener('click', closePanel);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

    // Expose to script.js
    window.openProductModal = openPanel;
    </script>
</body>
</html>
